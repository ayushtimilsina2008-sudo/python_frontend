<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous Radar Tracking Node</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #060d13; color: #00ff66; padding: 30px; }
        .radar-box { max-width: 550px; margin: 0 auto; background: #0b1d28; border: 2px solid #00ff66; border-radius: 8px; padding: 25px; box-shadow: 0 0 15px rgba(0,255,102,0.2); }
        .radar-screen { width: 100%; height: 120px; border: 1px solid #00ff66; margin-bottom: 20px; background: repeating-linear-gradient(0deg, #0b1d28, #0b1d28 2px, #0e2433 2px, #0e2433 4px); display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; }
        .radar-sweep { position: absolute; width: 100%; height: 2px; background: rgba(0,255,102,0.5); top: 50%; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { font-size: 11px; color: #88c0d0; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 8px; background-color: #060d13; border: 1px solid #00ff66; color: #00ff66; box-sizing: border-box; }
        .scan-btn { width: 100%; padding: 12px; background-color: #00ff66; color: #060d13; border: none; font-weight: bold; cursor: pointer; letter-spacing: 2px; }
        .scan-btn:hover { background-color: #33ff77; }
    </style>
</head>
<body>
<div class="radar-box">
    <div class="radar-screen">
        <div class="radar-sweep"></div>
        [ OBJECT LOCALIZATION RADAR ACTIVE ]
    </div>
    <div class="grid-layout">
        <div>
            <label>Camera Frame (Pixels)</label>
            <input type="number" value="125">
        </div>
        <div>
            <label>LiDAR Range (Meters)</label>
            <input type="number" value="1.95">
        </div>
    </div>
    <button class="scan-btn">ENGAGE SENSOR FUSION SEARCH</button>
</div>
</body>
</html>
